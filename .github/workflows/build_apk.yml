name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GlowKeyer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GlowKeyer.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest GlowKeyer.apk --title "Glow Keyer (latest)" --notes "Debug APK" --target ${{ github.sha }}
